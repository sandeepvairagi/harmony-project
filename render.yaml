services:
  # -----------------------------------------------
  # Backend API (Node.js Express)
  # -----------------------------------------------
  - type: web
    name: harmony-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE
        value: 7d
      - key: CLIENT_URL
        value: "*"

  # -----------------------------------------------
  # Frontend SPA (React + Vite)
  # -----------------------------------------------
  - type: web
    name: harmony-frontend
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
